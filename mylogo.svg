<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bgRadial" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#14172f" />
            <stop offset="100%" stop-color="#05060a" />
        </radialGradient>
        
        <!-- Trend Line Gradients -->
        <linearGradient id="trendLine" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#fe0979" />
        </linearGradient>
        
        <linearGradient id="trendArea" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
            <stop offset="60%" stop-color="#fe0979" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Patterns -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
        </pattern>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
        </pattern>
    </defs>

    <!-- Base Layers -->
    <rect width="1000" height="600" fill="url(#bgRadial)" />
    <rect width="1000" height="600" fill="url(#grid)" />
    <rect width="1000" height="600" fill="url(#dots)" />

    <!-- Giant Abstract AI Hexagon Core (Background) -->
    <g transform="translate(750, 300)" opacity="0.06">
        <polygon points="0,-250 216,-125 216,125 0,250 -216,125 -216,-125" fill="none" stroke="#00f2fe" stroke-width="8"/>
        <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" fill="none" stroke="#fe0979" stroke-width="4"/>
        <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 20"/>
        <circle cx="0" cy="0" r="200" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="4 8"/>
    </g>

    <!-- Faint Binary/Code Data Drops -->
    <g font-family="monospace" font-size="10" fill="#ffffff" opacity="0.04" letter-spacing="2">
        <text x="50" y="200">01001001 01001110 01010110</text>
        <text x="50" y="215">01000101 01010011 01010100</text>
        <text x="800" y="400">01000001 01001100 01010000</text>
        <text x="800" y="415">01001000 01000001 00100000</text>
        <text x="400" y="100">01010011 01001101 01000001</text>
    </g>

    <!-- Candlestick Background (Financial Market Data) -->
    <g opacity="0.2">
        <!-- Up (Cyan) Candles -->
        <g stroke="#00f2fe" fill="#00f2fe">
            <line x1="80" y1="480" x2="80" y2="550" stroke-width="2"/> <rect x="75" y="500" width="10" height="30" rx="2"/>
            <line x1="140" y1="440" x2="140" y2="510" stroke-width="2"/> <rect x="135" y="450" width="10" height="40" rx="2"/>
            <line x1="260" y1="400" x2="260" y2="470" stroke-width="2"/> <rect x="255" y="420" width="10" height="35" rx="2"/>
            <line x1="380" y1="360" x2="380" y2="430" stroke-width="2"/> <rect x="375" y="370" width="10" height="45" rx="2"/>
            <line x1="480" y1="230" x2="480" y2="300" stroke-width="2"/> <rect x="475" y="240" width="10" height="40" rx="2"/>
            <line x1="580" y1="200" x2="580" y2="280" stroke-width="2"/> <rect x="575" y="220" width="10" height="40" rx="2"/>
            <line x1="740" y1="120" x2="740" y2="200" stroke-width="2"/> <rect x="735" y="140" width="10" height="30" rx="2"/>
            <line x1="860" y1="50" x2="860" y2="130" stroke-width="2"/> <rect x="855" y="70" width="10" height="40" rx="2"/>
        </g>
        <!-- Down (Pink) Candles -->
        <g stroke="#fe0979" fill="#fe0979">
            <line x1="110" y1="460" x2="110" y2="530" stroke-width="2"/> <rect x="105" y="470" width="10" height="25" rx="2"/>
            <line x1="200" y1="430" x2="200" y2="490" stroke-width="2"/> <rect x="195" y="440" width="10" height="35" rx="2"/>
            <line x1="320" y1="380" x2="320" y2="450" stroke-width="2"/> <rect x="315" y="390" width="10" height="30" rx="2"/>
            <line x1="430" y1="300" x2="430" y2="380" stroke-width="2"/> <rect x="425" y="310" width="10" height="50" rx="2"/>
            <line x1="530" y1="240" x2="530" y2="310" stroke-width="2"/> <rect x="525" y="250" width="10" height="45" rx="2"/>
            <line x1="660" y1="160" x2="660" y2="240" stroke-width="2"/> <rect x="655" y="180" width="10" height="40" rx="2"/>
            <line x1="800" y1="100" x2="800" y2="180" stroke-width="2"/> <rect x="795" y="110" width="10" height="50" rx="2"/>
        </g>
    </g>

    <!-- Traditional Market Benchmark (Dashed Line) -->
    <path d="M 50 520 C 120 520, 150 480, 200 480 C 280 480, 300 450, 350 450 C 420 450, 450 380, 500 380 C 600 380, 620 320, 700 320 C 800 320, 820 280, 900 280" fill="none" stroke="#8a95a5" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
    <text x="900" y="270" font-family="monospace" font-size="10" fill="#8a95a5" text-anchor="end">TRADITIONAL BENCHMARK</text>

    <!-- Neural Network Lines (AI Analyzing the Chart) -->
    <g stroke="#4facfe" stroke-opacity="0.35" stroke-width="1.5">
        <line x1="200" y1="440" x2="250" y2="300" />
        <line x1="200" y1="440" x2="350" y2="520" />
        <line x1="350" y1="400" x2="250" y2="300" />
        <line x1="350" y1="400" x2="350" y2="520" />
        <line x1="350" y1="400" x2="450" y2="180" />
        <line x1="350" y1="400" x2="600" y2="380" />
        <line x1="500" y1="260" x2="250" y2="300" />
        <line x1="500" y1="260" x2="450" y2="180" />
        <line x1="500" y1="260" x2="800" y2="250" />
        <line x1="500" y1="260" x2="600" y2="380" />
        <line x1="700" y1="180" x2="450" y2="180" />
        <line x1="700" y1="180" x2="650" y2="80" />
        <line x1="700" y1="180" x2="800" y2="250" />
        <line x1="900" y1="80" x2="650" y2="80" />
        <line x1="900" y1="80" x2="800" y2="250" />
    </g>

    <!-- Floating AI Nodes -->
    <circle cx="250" cy="300" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="450" cy="180" r="4" fill="#fe0979" filter="url(#glow)"/>
    <circle cx="650" cy="80" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="800" cy="250" r="4" fill="#fe0979" filter="url(#glow)"/>
    <circle cx="350" cy="520" r="4" fill="#4facfe" filter="url(#glow)"/>
    <circle cx="600" cy="380" r="4" fill="#4facfe" filter="url(#glow)"/>

    <!-- Concentric HUD rings around Key Floating Node -->
    <g transform="translate(450, 180)">
        <circle cx="0" cy="0" r="18" fill="none" stroke="#fe0979" stroke-width="1" stroke-dasharray="2 4" opacity="0.8" />
        <circle cx="0" cy="0" r="26" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />
    </g>
    <g transform="translate(800, 250)">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#fe0979" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
    </g>

    <!-- Main AI Trend Chart -->
    <!-- Area under the curve -->
    <path d="M 50 520 C 120 520, 150 440, 200 440 C